{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
# NOTE: for demo/lab only. In production set secret.existingSecret to a Secret
# managed by External Secrets Operator / AWS Secrets Manager CSI driver.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phoenix-liveview.fullname" . }}
  labels:
    {{- include "phoenix-liveview.labels" . | nindent 4 }}
  annotations:
    # Created before the migrate hook (weight -10 < -5) and kept afterwards so
    # the running pods can also read it. Prod should use secret.existingSecret.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.data.DATABASE_URL is required" .Values.secret.data.DATABASE_URL | quote }}
  SECRET_KEY_BASE: {{ required "secret.data.SECRET_KEY_BASE is required" .Values.secret.data.SECRET_KEY_BASE | quote }}
{{- end }}
