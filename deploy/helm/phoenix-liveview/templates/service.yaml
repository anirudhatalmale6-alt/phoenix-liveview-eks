apiVersion: v1
kind: Service
metadata:
  name: {{ include "phoenix-liveview.fullname" . }}
  labels:
    {{- include "phoenix-liveview.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # ClientIP affinity: a second layer of stickiness so in-cluster clients (and
  # ALB IP targets) reconnect to the same pod, keeping LiveView state stable.
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- if eq .Values.service.sessionAffinity "ClientIP" }}
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.service.sessionAffinityTimeoutSeconds }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "phoenix-liveview.selectorLabels" . | nindent 4 }}
